<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Exposition preview unavailable</title>
  <desc id="desc">A neutral placeholder shown when an exposition thumbnail cannot be loaded.</desc>
  <rect width="500" height="500" fill="#ffffff"/>
  <rect x="85" y="85" width="330" height="330" fill="#e2e2e2"/>
  <clipPath id="preview">
    <rect x="85" y="85" width="330" height="330"/>
  </clipPath>
  <g clip-path="url(#preview)">
    <path d="M25 335 155 205h110L135 335z" fill="#b5b5b5"/>
    <path d="M135 415 315 235h110L245 415z" fill="#939393"/>
    <path d="M255 415 415 255v110L365 415z" fill="#747474"/>
  </g>
</svg>